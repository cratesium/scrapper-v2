name: Daily Job Scraper

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
    - cron: '30 15 * * *'  # 9:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scraper runs from pushing to main at the same time
concurrency:
  group: daily-job-scraper
  cancel-in-progress: false

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --------------------------------------------------
      # Install Dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # Run Job Scraper
      # --------------------------------------------------
      - name: Run Job Scraper
        env:
          GMAIL_USER: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python main.py

      - name: Commit Updated Report Randomly
        shell: bash
        run: |
          set -e
  
            git config user.name "cratesium"
            git config user.email "cratesium@gmail.com"
  
            echo "=== Checking report changes ==="
  
            git status --short
  
            git add reports/
  
            if git diff --cached --quiet; then
              echo "No report changes to commit."
              exit 0
            fi
  
            echo "Report changes detected."
  
            # Random number between 1 and 10
            COMMITS=$((RANDOM % 10 + 1))
  
            echo "Random commit count: $COMMITS"
  
            # --------------------------------------------------
            # Commit the actual report changes FIRST
            # --------------------------------------------------
            git commit \
              -m "Job digest $(date -u +'%Y-%m-%d %H:%M UTC') [1/$COMMITS]"
  
            echo "Report changes committed."
  
            # --------------------------------------------------
            # Get latest main
            # --------------------------------------------------
            git fetch origin main
  
            # --------------------------------------------------
            # Rebase the report commit on latest main
            # --------------------------------------------------
            git rebase origin/main
  
            # --------------------------------------------------
            # Create remaining empty commits
            # --------------------------------------------------
            if [ "$COMMITS" -gt 1 ]; then
  
              for ((i=2; i<=COMMITS; i++)); do
  
                DELAY=$((RANDOM % 10 + 1))
  
                echo "Waiting ${DELAY} seconds before commit $i..."
                sleep "$DELAY"
  
                git commit --allow-empty \
                  -m "Job digest $(date -u +'%Y-%m-%d %H:%M UTC') [$i/$COMMITS]"
  
              done
  
            fi
  
            # --------------------------------------------------
            # Push
            # --------------------------------------------------
            echo "Pushing $COMMITS commits..."
  
            git push origin HEAD:main
  
            echo "=== Successfully pushed $COMMITS commits ==="D:main
