name: Daily Job Scraper

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
    - cron: '30 15 * * *'  # 9:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scraper runs from pushing to main at the same time
concurrency:
  group: daily-job-scraper
  cancel-in-progress: false

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --------------------------------------------------
      # Install Dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # Run Job Scraper
      # --------------------------------------------------
      - name: Run Job Scraper
        env:
          GMAIL_USER: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python main.py

      - name: Commit Updated Report 
        run: |
          git config --global user.name "cratesium"
          git config --global user.email "cratesium@gmail.com"

          echo "Staging report changes..."
          git add reports/

          # Exit if there are no changes
          if git diff --staged --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          # --------------------------------------------------
          # First commit: actual report changes
          # --------------------------------------------------
          COMMITS=$((RANDOM % 10 + 1))

          echo "======================================"
          echo " commit count: $COMMITS"
          echo "======================================"

          git commit \
            -m "Job digest $(date -u +'%Y-%m-%d %H:%M UTC') [1/$COMMITS]"

          # --------------------------------------------------
          # Get latest remote changes
          # --------------------------------------------------
          git fetch origin main

          # Rebase our report commit on top of latest main
          git rebase origin/main

          # --------------------------------------------------
          # Additional empty commits
          # --------------------------------------------------
          for ((i=2; i<=COMMITS; i++)); do

            # Random delay between 1–10 seconds
            DELAY=$((RANDOM % 10 + 1))

            echo "Waiting ${DELAY} seconds before commit $i..."
            sleep "${DELAY}"

            git commit \
              --allow-empty \
              -m "Job digest $(date -u +'%Y-%m-%d %H:%M UTC') [$i/$COMMITS]"

          done

          # --------------------------------------------------
          # Push all commits
          # --------------------------------------------------
          echo "Pushing $COMMITS commits to main..."

          git push origin HEAD:main
