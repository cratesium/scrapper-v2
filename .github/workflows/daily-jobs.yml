name: Daily Job Scraper

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
    - cron: '30 15 * * *'  # 9:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scraper runs from pushing to main at the same time
concurrency:
  group: daily-job-scraper
  cancel-in-progress: false

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --------------------------------------------------
      # Install Dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # Run Job Scraper
      # --------------------------------------------------
      - name: Run Job Scraper
        env:
          GMAIL_USER: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python main.py


