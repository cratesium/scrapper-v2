name: Daily Job Scraper

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST  — morning digest
    - cron: '30 15 * * *'  # 9:00 PM IST  — evening digest
  workflow_dispatch:        # manually trigger from the Actions tab


permissions:
  contents: write

# ---------------------------------------------------------------------------
# Required GitHub Actions secrets:
#   GMAIL_USER          — sender Gmail address  (e.g. you@gmail.com)
#   GMAIL_APP_PASSWORD  — Gmail App Password    (16-char, 2FA required)
#   TO_EMAIL            — recipient(s); comma-separate for multiple addresses
#                         e.g. "alice@gmail.com,bob@gmail.com"
# ---------------------------------------------------------------------------

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Supports multiple recipients — comma-separated list in the secret
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python main.py

      - name: Commit updated report
        run: |
          git config --global user.name "job-scraper-bot"
          git config --global user.email "actions@github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Job digest $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
