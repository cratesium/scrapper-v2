name: Daily Job Scraper

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
    - cron: '30 15 * * *'  # 9:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scraper runs from pushing to main at the same time
concurrency:
  group: daily-job-scraper
  cancel-in-progress: false

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Scraper
        env:
          GMAIL_USER: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py

      - name: Commit updated report
        run: |
          git config --global user.name "job-scraper-bot"
          git config --global user.email "actions@github.com"

          git add reports/

          if git diff --staged --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Job digest $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Get any commits that appeared on remote after checkout
          git fetch origin main

          # Put our generated report commit on top of remote main
          git rebase origin/main

          # Push the updated history
          git push origin HEAD:main
